<section class="section featured-section" id="featured-section">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="contaniner__inner animate">
          <div class="section__info">
            <div class="section__head">
              <h2 class="section__title">{{ include.title }}</h2>
            </div>
            <div class="section__description">{{ include.description_html }}</div>
          </div>

          {% if include.show_projects and site.featured_projects %}
            <div class="row">
              {% for project in site.projects %}
                {% if site.featured_projects contains project.title %}
                  {% bookshop project-card project=project %}
                {% endif %}
              {% endfor %}
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</section>
